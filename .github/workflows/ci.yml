name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        database: ['mysql:8.4', 'mariadb:11.4']

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      # Pinned Restic release used for the real-repository integration tests.
      # Must match Quraba\Backup\Restic\ResticRelease (version + linux_amd64 SHA-256).
      RESTIC_VERSION: '0.19.1'
      RESTIC_SHA256: 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c'
      # Real dump/archive test against the service database (throwaway DB per test).
      QURABA_BACKUP_TEST_MYSQL_HOST: '127.0.0.1'
      QURABA_BACKUP_TEST_MYSQL_PORT: '3306'
      QURABA_BACKUP_TEST_MYSQL_USERNAME: 'root'
      QURABA_BACKUP_TEST_MYSQL_PASSWORD: 'root'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bz2, curl, json, mbstring, openssl, pdo, pdo_sqlite, pdo_mysql, posix, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan max)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Install pinned Restic for integration tests (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restic"
          cd "$RUNNER_TEMP/restic"
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 -c restic.bz2 > restic
          chmod 0700 restic
          ./restic version
          echo "QURABA_BACKUP_TEST_RESTIC_BINARY=$RUNNER_TEMP/restic/restic" >> "$GITHUB_ENV"

      - name: Database client tools
        run: mysqldump --version

      - name: Tests (no B2 credentials, no Redis, no sudo)
        run: vendor/bin/phpunit
