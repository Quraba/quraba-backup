name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:
    inputs:
      run_b2:
        description: Run the real Backblaze B2 release gate against a disposable test bucket
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows (PHP 8.5, real Restic)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bz2, curl, fileinfo, intl, json, mbstring, openssl, pdo, pdo_sqlite, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan max)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Install official Windows Restic through package installer
        shell: pwsh
        run: |
          $env:QURABA_BACKUP_TEST_WINDOWS_INSTALLER = '1'
          $env:QURABA_BACKUP_TEST_WINDOWS_EXPORT_BINARY = Join-Path $env:RUNNER_TEMP 'restic.exe'
          php vendor/bin/phpunit --fail-on-skipped --fail-on-incomplete tests/Integration/RealWindowsInstallerTest.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "QURABA_BACKUP_TEST_RESTIC_BINARY=$env:QURABA_BACKUP_TEST_WINDOWS_EXPORT_BINARY"

      - name: Full PHPUnit suite
        run: vendor/bin/phpunit

      - name: Real Windows repository, backup and exact media restore
        run: >-
          vendor/bin/phpunit --fail-on-skipped --fail-on-incomplete
          tests/Integration/RealResticRepositoryTest.php
          tests/Integration/RealResticMediaTest.php

  quality:
    name: Quality (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        database: ['mysql:8.4', 'mariadb:11.4']

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      # Pinned Restic release used for the real-repository integration tests.
      # Must match Quraba\Backup\Restic\ResticRelease (version + linux_amd64 SHA-256).
      RESTIC_VERSION: '0.19.1'
      RESTIC_SHA256: 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c'
      # Real dump/archive test against the service database (throwaway DB per test).
      QURABA_BACKUP_TEST_MYSQL_HOST: '127.0.0.1'
      QURABA_BACKUP_TEST_MYSQL_PORT: '3306'
      QURABA_BACKUP_TEST_MYSQL_USERNAME: 'root'
      QURABA_BACKUP_TEST_MYSQL_PASSWORD: 'root'
      QURABA_BACKUP_TEST_EXPECT_FLAVOR: ${{ startsWith(matrix.database, 'mysql:') && 'mysql' || 'mariadb' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bz2, curl, json, mbstring, openssl, pdo, pdo_sqlite, pdo_mysql, posix, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan max)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Install pinned Restic for integration tests (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restic"
          cd "$RUNNER_TEMP/restic"
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 -c restic.bz2 > restic
          chmod 0700 restic
          ./restic version
          echo "QURABA_BACKUP_TEST_RESTIC_BINARY=$RUNNER_TEMP/restic/restic" >> "$GITHUB_ENV"

      - name: Install real database clients on the Ubuntu host
        run: |
          set -euo pipefail
          sudo apt-get update
          if [[ '${{ matrix.database }}' == 'mysql:8.4' ]]; then
            sudo apt-get install -y mysql-client-8.0
            echo 'QURABA_BACKUP_DB_DUMP_BINARY=/usr/bin/mysqldump' >> "$GITHUB_ENV"
            echo 'QURABA_BACKUP_DB_CLIENT_BINARY=/usr/bin/mysql' >> "$GITHUB_ENV"
            mysqldump --version
            mysql --version
          else
            sudo apt-get install -y mariadb-client
            echo 'QURABA_BACKUP_DB_DUMP_BINARY=/usr/bin/mariadb-dump' >> "$GITHUB_ENV"
            echo 'QURABA_BACKUP_DB_CLIENT_BINARY=/usr/bin/mariadb' >> "$GITHUB_ENV"
            mariadb-dump --version
            mariadb --version
          fi

      - name: Tests (no B2 credentials, no Redis, no sudo)
        run: vendor/bin/phpunit

      # The destructive restore must be proven with the real tools on Linux:
      # real Restic, the real dump and client binaries and the service
      # database (state A → B → live restore of A, clean-host restore, real
      # failures after the destructive boundary, scratch cleanup failure).
      # A skipped test here would hide a missing prerequisite, so it fails.
      - name: Real live restore and clean-host recovery (must not be skipped)
        run: >-
          vendor/bin/phpunit --fail-on-skipped --fail-on-incomplete
          tests/Integration/RealLiveRestoreTest.php
          tests/Integration/RealDatabaseArchiveTest.php
          tests/Integration/RealResticMediaTest.php

  b2-release-gate:
    name: Real B2 release gate (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_b2 == true }}
    runs-on: ubuntu-24.04
    env:
      RESTIC_VERSION: '0.19.1'
      RESTIC_SHA256: 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bz2, curl, json, mbstring, openssl, pdo, pdo_sqlite, posix, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install pinned Restic (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restic"
          cd "$RUNNER_TEMP/restic"
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 -c restic.bz2 > restic
          chmod 0700 restic
          ./restic version
          echo "QURABA_BACKUP_TEST_RESTIC_BINARY=$RUNNER_TEMP/restic/restic" >> "$GITHUB_ENV"

      - name: Real B2 integration (skips and incomplete tests fail)
        env:
          QURABA_BACKUP_TEST_B2: '1'
          QURABA_BACKUP_TEST_B2_ENDPOINT: ${{ secrets.QURABA_BACKUP_TEST_B2_ENDPOINT }}
          QURABA_BACKUP_TEST_B2_REGION: ${{ secrets.QURABA_BACKUP_TEST_B2_REGION }}
          QURABA_BACKUP_TEST_B2_BUCKET: ${{ secrets.QURABA_BACKUP_TEST_B2_BUCKET }}
          QURABA_BACKUP_TEST_B2_KEY_ID: ${{ secrets.QURABA_BACKUP_TEST_B2_KEY_ID }}
          QURABA_BACKUP_TEST_B2_APPLICATION_KEY: ${{ secrets.QURABA_BACKUP_TEST_B2_APPLICATION_KEY }}
          QURABA_BACKUP_TEST_B2_ALLOW_INIT: '1'
          QURABA_BACKUP_TEST_B2_PRUNE: '1'
        run: >-
          vendor/bin/phpunit --fail-on-skipped --fail-on-incomplete
          tests/Integration/B2RepositoryTest.php
